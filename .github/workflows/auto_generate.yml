name: Auto Generate Pawarta Folders & Articleson:push:branches: [ main ]workflow_dispatch:jobs:build:runs-on: ubuntu-latestpermissions:contents: writesteps:- name: Checkout repositoryuses: actions/checkout@v4  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.10'

  - name: Run Generator Script
    run: |
      python generate_all.py

  - name: Commit and push generated files
    run: |
      git config --global user.name "GitHub Actions Bot"
      git config --global user.email "actions@github.com"
      git add .
      git diff --quiet && git diff --staged --quiet || (git commit -m "Automated folder & article generation via GitHub Actions" && git push)
