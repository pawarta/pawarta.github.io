name: Auto Generate & Publish Blog

on:
  push:
    branches: [ main ]
  schedule:
    # Otomatis berjalan setiap hari jam 00:00 UTC
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Blog Generator Script
        run: python blog.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Otomatis update folder dan artikel blog terbaru"
          branch: main
